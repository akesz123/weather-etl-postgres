services:
  db:
    image: postgres:16
    container_name: weather_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    ports:
      - "65433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer:5.2.1
    container_name: adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "18080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  postgres-data: